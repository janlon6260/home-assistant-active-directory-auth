name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest --cov=ldapauth --cov-report=term-missing
      - run: python -m pip_audit -r ldapauth/requirements.txt
      - run: |
          sudo apt-get update
          sudo apt-get install -y apparmor-utils shellcheck
          apparmor_parser --skip-kernel-load --skip-read-cache ldapauth/apparmor.txt
          shellcheck ldapauth/rootfs/etc/s6-overlay/s6-rc.d/ldapauth/run

  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ldapauth
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: local/ad-auth:ci
          build-args: BUILD_VERSION=3.0.0
      - name: Verify container startup and health
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/ad-auth-data"
          echo '{"ldap_server":"ldaps://dc.example.com:636"}' > "${RUNNER_TEMP}/ad-auth-data/options.json"
          docker run --detach --name ad-auth-test --volume "${RUNNER_TEMP}/ad-auth-data:/data" local/ad-auth:ci
          for attempt in $(seq 1 30); do
            if docker exec ad-auth-test /opt/venv/bin/python -c 'from urllib.request import urlopen; assert urlopen("http://127.0.0.1:8000/health").status == 200'; then
              exit 0
            fi
            sleep 2
          done
          docker logs ad-auth-test
          exit 1
      - name: Stop test container
        if: always()
        run: docker stop ad-auth-test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m scripts.browser_smoke
