name: "Active Directory Authentication"
version: "3.0.2"
slug: "ldapauth"
description: "Active Directory sign-in with secure LDAP, certificate management and Ingress"
url: https://github.com/janlon6260/home-assistant-active-directory-auth
init: false
arch:
  - amd64
  - aarch64
startup: services
boot: auto
breaking_versions:
  - "3.0.0"
apparmor: true
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-account
panel_title: Active Directory
panel_admin: true
watchdog: "http://[HOST]:[PORT:8000]/health"
timeout: 60
map:
  - type: ssl
    read_only: true
  - type: homeassistant_config
    path: /homeassistant
    read_only: true
options:
  ldap_server: "ldaps://dc.example.com:636"
  bind_user: ""
  bind_password: ""
  user_base_dn: ""
  groups_base_dn: ""
  user_group: ""
  admin_group: ""
  enable_ldaps: true
  ldaps_verify: true
  ldaps_ca_pem: ""
  debug_logging: false
schema:
  ldap_server: str
  bind_user: str
  bind_password: password
  user_base_dn: str
  groups_base_dn: str
  user_group: str
  admin_group: str
  enable_ldaps: bool?
  ldaps_verify: bool?
  ldaps_ca_pem: str?
  debug_logging: bool?
